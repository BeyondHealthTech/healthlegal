name: Vercel Deploy

# Vercel の Git 連携は private org repo だと Pro プランが必要なため、
# Vercel CLI をトークンで叩く方式で自動デプロイする（bht-ops の recruitment-lp と同方式）。
# これまで healthlegal.vercel.app は手動 CLI デプロイのみで、master にマージしても
# 本番へ反映されない状態だった（GitHub Pages 側のみ自動）。本ワークフローでそれを解消する。
#
# 必要な Secrets（リポジトリ設定 > Secrets and variables > Actions）:
#   VERCEL_TOKEN      : Vercel のパーソナルトークン
#   VERCEL_ORG_ID     : .vercel/project.json の orgId（ローカルで `vercel link` 済みなら確認可）
#   VERCEL_PROJECT_ID : .vercel/project.json の projectId（healthlegal プロジェクトのもの）
#
# Secrets 登録後、workflow_dispatch で手動実行すれば push なしで初回デプロイできる。
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (fail fast before touching Vercel)
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed to: ${url}"

      - name: Summary
        run: |
          {
            echo "### HealthLegal Vercel デプロイ完了"
            echo ""
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- 公開URL: https://healthlegal.vercel.app"
          } >> "$GITHUB_STEP_SUMMARY"
